version: '3'

volumes:
  pg_data:
  static_volume:
  media_volume:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: artemdecide/kittygram_backend:v2
    env_file: .env
    volumes:
      - static_volume:/static_backend
      - media_volume:/media

  frontend:
    image: artemdecide/kittygram_frontend:latest
    env_file: .env
    volumes:
      - static_volume:/frontend_static
    command: cp -r /app/build/. /frontend_static/

  gateway:
    image: artemdecide/kittygram_gateway:latest
    env_file: .env
    volumes:
      - static_volume:/static
      - media_volume:/media
    ports:
      - 9000:80